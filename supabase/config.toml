[functions.public-analytics]
verify_jwt = true

# User-only per-report ingest: the platform verifies the JWT AND server/ingest/handler.ts calls getUser + checks claims.
[functions.community-ingest]
verify_jwt = true

# User-only personal comparison (read-only): platform JWT check AND getUser + claims in server/personalHandler.ts.
[functions.my-analytics]
verify_jwt = true

# User-only read of the user's own completed reports (Chrome extension, contracts/my-reports): platform JWT check AND
# getUser + claims in server/myReports/handler.ts AND the DB identity/session gate in internal_my_reports_*.
[functions.my-reports]
verify_jwt = true

# Contributor-gated aggregate ranks; platform JWT + getUser + DB map eligibility on every page.
[functions.user-rankings]
verify_jwt = true
