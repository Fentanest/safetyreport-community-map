name: community-map-product-check
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python3 -m unittest discover -s tests/blueprint -v
      - run: python3 -m unittest discover -s tests/product -p 'test_*.py' -v
      - run: npm test
      - run: npm run build
        env:
          VITE_DATA_MODE: live
          VITE_BASE_PATH: /
      - run: npm run scan
