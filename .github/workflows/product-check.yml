name: community-map-product-check
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python3 -m unittest discover -s tests/blueprint -v
      - run: python3 -m unittest discover -s tests/product -p 'test_*.py' -v
      - run: npm test
      - run: npm run build
        env:
          VITE_DATA_MODE: live
          VITE_BASE_PATH: /safetyreport-community-map/
      - run: npm run scan
