# Only validates the shipped specification helpers, not the completed product.
name: blueprint-reference-check
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/cm_spec.py'
      - 'scripts/scan_public_dist.py'
      - 'scripts/muse_dispatch.py'
      - 'tests/blueprint/**'
permissions:
  contents: read
jobs:
  reference-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests/blueprint -v
