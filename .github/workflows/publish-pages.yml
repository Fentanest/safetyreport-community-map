name: community-map-pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-map-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Require configured public endpoints
        env:
          PUBLIC_ANALYTICS_URL: ${{ vars.PUBLIC_ANALYTICS_URL }}
          VITE_KAKAO_MAP_JS_KEY: ${{ vars.KAKAO_MAP_JS_KEY }}
        run: |
          test -n "$PUBLIC_ANALYTICS_URL"
          test -n "$VITE_KAKAO_MAP_JS_KEY"
      - run: npm ci
      - run: python3 -m unittest discover -s tests/blueprint -v
      - run: python3 -m unittest discover -s tests/product -p 'test_*.py' -v
      - run: npm test
      - name: Export current sanitized public snapshot
        run: npm run data:export
        env:
          PUBLIC_ANALYTICS_URL: ${{ vars.PUBLIC_ANALYTICS_URL }}
      - name: Build live Pages artifact
        run: npm run build
        env:
          VITE_DATA_MODE: live
          VITE_BASE_PATH: /safetyreport-community-map/
          VITE_PUBLIC_ANALYTICS_URL: ${{ vars.PUBLIC_ANALYTICS_URL }}
          VITE_KAKAO_MAP_JS_KEY: ${{ vars.KAKAO_MAP_JS_KEY }}
      - run: npm run scan
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated public artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
