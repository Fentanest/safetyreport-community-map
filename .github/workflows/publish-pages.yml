name: community-map-pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-map-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
      - name: Require configured public endpoints
        env:
          PUBLIC_ANALYTICS_URL: ${{ vars.PUBLIC_ANALYTICS_URL }}
          VITE_KAKAO_MAP_JS_KEY: ${{ vars.KAKAO_MAP_JS_KEY }}
          MAP_SUPABASE_URL: ${{ vars.MAP_SUPABASE_URL }}
          MAP_SUPABASE_PUBLISHABLE_KEY: ${{ vars.MAP_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$PUBLIC_ANALYTICS_URL"
          test -n "$VITE_KAKAO_MAP_JS_KEY"
          test -n "$MAP_SUPABASE_URL"
          test -n "$MAP_SUPABASE_PUBLISHABLE_KEY"
      - name: Refuse deployment while anonymous analytics is public
        env:
          PUBLIC_ANALYTICS_URL: ${{ vars.PUBLIC_ANALYTICS_URL }}
        run: |
          status=$(curl --silent --show-error --max-time 20 --output /tmp/cm-anonymous-meta.json --write-out '%{http_code}' \
            --header 'Origin: https://safemap.worklazy.net' \
            "${PUBLIC_ANALYTICS_URL%/}/public-analytics/meta")
          test "$status" = 401
          jq -e '((.error.code == "auth_required") or (.code == "UNAUTHORIZED_NO_AUTH_HEADER"))
            and (has("dataset_version") | not)' /tmp/cm-anonymous-meta.json > /dev/null
      - run: npm ci
      - run: python3 -m unittest discover -s tests/blueprint -v
      - run: python3 -m unittest discover -s tests/product -p 'test_*.py' -v
      - run: npm test
      # No static data snapshot while the map is contributor-only (2026-09-27): a file on Pages would be readable by
      # anyone who knows its URL. Every read goes through the API's viewer check (server/publicHandler.ts).
      - name: Build live Pages artifact
        run: npm run build
        env:
          VITE_DATA_MODE: live
          VITE_BASE_PATH: /
          VITE_PUBLIC_ANALYTICS_URL: ${{ vars.PUBLIC_ANALYTICS_URL }}
          VITE_KAKAO_MAP_JS_KEY: ${{ vars.KAKAO_MAP_JS_KEY }}
          # Required map login. Public configuration only.
          VITE_SUPABASE_URL: ${{ vars.MAP_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.MAP_SUPABASE_PUBLISHABLE_KEY }}
      - run: npm run scan
      - name: No data files in the Pages artifact (contributor-only)
        run: test ! -e dist/data
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated public artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
